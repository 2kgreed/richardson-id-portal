<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Employee Record — Richardson Oil and Gas</title>
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <!-- Topbar -->
  <header class="topbar">
    <div class="brand-wrapper">
      <img src="/assets/logo.svg" alt="Richardson Oil and Gas" class="brand-logo-img" />
      <div class="brand-info">
        <span class="brand-name">Richardson Oil &amp; Gas</span>
        <span class="brand-tag">Employee Registration</span>
      </div>
    </div>
    <a class="btn btn-quiet btn-sm" href="/admin/dashboard.html">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      Cancel &amp; Return
    </a>
  </header>

  <main class="wrap" style="max-width: 620px;">
    <div class="card">
      <h1 id="formTitle">Register New Employee</h1>
      <p class="lead">Fill in the employee credentials to issue an official identity card.</p>

      <form id="employeeForm" novalidate>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
          <div class="field">
            <label for="firstName">First Name *</label>
            <input type="text" id="firstName" required maxlength="99" placeholder="e.g. Samuel" />
          </div>
          <div class="field">
            <label for="lastName">Last Name *</label>
            <input type="text" id="lastName" required maxlength="99" placeholder="e.g. Adebayo" />
          </div>
        </div>

        <div class="field">
          <label for="jobTitle">Job Title / Designation</label>
          <input type="text" id="jobTitle" maxlength="149" placeholder="e.g. Senior Petroleum Geologist" />
        </div>

        <div class="field">
          <label for="department">Department / Division</label>
          <input type="text" id="department" maxlength="149" placeholder="e.g. Exploration &amp; Production" />
        </div>

        <div class="field">
          <label for="employeeNumber">Employee ID Number</label>
          <input type="text" id="employeeNumber" maxlength="49" placeholder="e.g. ROG-2026-084" />
          <div class="field-hint">Unique corporate ID code displayed on physical card.</div>
        </div>

        <div class="field">
          <label for="photo">Personnel Passport Photo</label>
          <div class="photo-upload-container">
            <div class="photo-preview-box" id="previewBox">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <circle cx="12" cy="8" r="4"></circle>
                <path d="M4 20c0-4 4-6 8-6s8 2 8 6"></path>
              </svg>
            </div>
            <div style="flex: 1;">
              <input type="file" id="photo" accept="image/png, image/jpeg" />
              <div class="field-hint">PNG or JPG, maximum 5MB. Clear face portrait recommended.</div>
            </div>
          </div>
        </div>

        <div class="error-text" id="err"></div>

        <div style="display: flex; gap: 12px; margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--slate-200);">
          <button type="submit" class="btn btn-primary" id="saveBtn">
            Save &amp; Generate Card
          </button>
          <a class="btn btn-quiet" href="/admin/dashboard.html">Cancel</a>
        </div>
      </form>
    </div>
  </main>

  <script type="module" src="/admin/employee-form.js"></script>
</body>
</html>
