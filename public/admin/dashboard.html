<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Personnel ID Management — Richardson Oil and Gas</title>
  <link rel="icon" type="image/png" href="/assets/richardson-logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css?v=4" />
  <style>
    .pagination-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      border-top: 1px solid var(--slate-200);
      background: #ffffff;
    }
    .pagination-btn-group {
      display: flex;
      gap: 8px;
    }
  </style>
</head>
<body>
  <!-- Corporate Quick Contact Header -->
  <div class="corporate-header-banner">
    <div class="corporate-header-links">
      <span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -2px; margin-right: 4px;"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
        +234 803 222 0279, +234 908 859 0341
      </span>
      <span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -2px; margin-right: 4px;"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
        <a href="mailto:info@richardson-oilandgas.com">info@richardson-oilandgas.com</a>
      </span>
    </div>
    <div>
      <a href="https://www.richardsonoilandgas.com" target="_blank" rel="noopener">
        richardsonoilandgas.com
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -1px; margin-left: 2px;"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
      </a>
    </div>
  </div>

  <!-- Top Navigation Bar -->
  <header class="topbar">
    <div class="brand-wrapper">
      <img src="/assets/richardson-logo.png" alt="Richardson Oil and Gas" class="brand-logo-img" />
      <span class="brand-tag">ID System</span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px;">
      <span id="adminEmailBadge" style="font-size: 0.8rem; color: var(--slate-500); display: none;"></span>
      <button class="btn btn-quiet btn-sm" id="logoutBtn" type="button">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        Sign out
      </button>
    </div>
  </header>

  <main class="wrap">
    <!-- Metrics Grid -->
    <div class="metrics-grid">
      <div class="metric-card">
        <span class="metric-label">Total ID Cards</span>
        <span class="metric-value" id="metricTotal">0</span>
      </div>
      <div class="metric-card">
        <span class="metric-label">Active Credentials</span>
        <span class="metric-value active" id="metricActive">0</span>
      </div>
      <div class="metric-card">
        <span class="metric-label">Revoked Credentials</span>
        <span class="metric-value revoked" id="metricRevoked">0</span>
      </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="search-input-wrap">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="search" id="searchBox" placeholder="Search by name, ID number, role, or department…" />
      </div>
      <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
        <!-- Department / Team Filter Dropdown -->
        <select id="deptSelect" style="padding: 9px 14px; border: 1px solid var(--slate-300); border-radius: var(--radius-sm); font-size: 0.85rem; background: #ffffff; color: var(--slate-800); font-weight: 600; cursor: pointer;">
          <option value="">All Departments (All Staff)</option>
        </select>
        <button class="btn btn-quiet" id="toggleGroupingBtn" type="button" title="Toggle grouped view by department">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
          <span id="groupingBtnLabel">Group by Department</span>
        </button>
        <button class="btn btn-quiet" id="exportCsvBtn" type="button">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          Export CSV
        </button>
        <a class="btn btn-primary" href="/admin/employee-form.html">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          Issue New ID Card
        </a>
      </div>
    </div>

    <!-- Quick Department Pills Filter Bar -->
    <div class="dept-filter-bar">
      <div class="dept-pills-wrap" id="deptPillsContainer">
        <!-- Injected dynamically from roster data -->
      </div>
      <span id="resultsCount" style="font-size: 0.82rem; color: var(--slate-600); font-weight: 700;"></span>
    </div>

    <!-- Roster Table Container -->
    <div class="table-container">
      <table class="roster">
        <thead>
          <tr>
            <th>Employee</th>
            <th>Department</th>
            <th>Employee ID</th>
            <th>Status</th>
            <th style="text-align: right;">Card Actions</th>
          </tr>
        </thead>
        <tbody id="rosterBody">
          <tr class="skeleton-row">
            <td><div style="display: flex; align-items: center; gap: 12px;"><div class="skeleton-avatar"></div><div><div class="skeleton-block" style="width: 140px; margin-bottom: 6px;"></div><div class="skeleton-block" style="width: 90px;"></div></div></div></td>
            <td><div class="skeleton-block" style="width: 110px;"></div></td>
            <td><div class="skeleton-block" style="width: 75px;"></div></td>
            <td><div class="skeleton-block" style="width: 60px;"></div></td>
            <td><div class="skeleton-block" style="width: 120px; margin-left: auto;"></div></td>
          </tr>
          <tr class="skeleton-row">
            <td><div style="display: flex; align-items: center; gap: 12px;"><div class="skeleton-avatar"></div><div><div class="skeleton-block" style="width: 130px; margin-bottom: 6px;"></div><div class="skeleton-block" style="width: 80px;"></div></div></div></td>
            <td><div class="skeleton-block" style="width: 95px;"></div></td>
            <td><div class="skeleton-block" style="width: 70px;"></div></td>
            <td><div class="skeleton-block" style="width: 60px;"></div></td>
            <td><div class="skeleton-block" style="width: 120px; margin-left: auto;"></div></td>
          </tr>
          <tr class="skeleton-row">
            <td><div style="display: flex; align-items: center; gap: 12px;"><div class="skeleton-avatar"></div><div><div class="skeleton-block" style="width: 150px; margin-bottom: 6px;"></div><div class="skeleton-block" style="width: 100px;"></div></div></div></td>
            <td><div class="skeleton-block" style="width: 105px;"></div></td>
            <td><div class="skeleton-block" style="width: 80px;"></div></td>
            <td><div class="skeleton-block" style="width: 60px;"></div></td>
            <td><div class="skeleton-block" style="width: 120px; margin-left: auto;"></div></td>
          </tr>
        </tbody>
      </table>

      <!-- Pagination Footer -->
      <div class="pagination-bar" id="paginationBar" style="display: none;">
        <span id="paginationInfo" style="font-size: 0.82rem; color: var(--slate-500);">Showing 1-10 of 20</span>
        <div class="pagination-btn-group">
          <button class="btn btn-quiet btn-sm" id="prevPageBtn" disabled>Previous</button>
          <button class="btn btn-quiet btn-sm" id="nextPageBtn" disabled>Next</button>
        </div>
      </div>
    </div>
  </main>

  <div id="toast" class="toast-msg"></div>

  <script type="module" src="/admin/dashboard.js"></script>
</body>
</html>
