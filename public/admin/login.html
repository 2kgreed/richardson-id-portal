<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Portal Sign In — Richardson Oil and Gas</title>
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg" />
  <link rel="stylesheet" href="/css/styles.css" />
  <style>
    body {
      background: radial-gradient(circle at 50% 20%, #152243 0%, #080d1a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-container {
      width: 100%;
      max-width: 420px;
      padding: 24px;
    }
    .login-card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.4);
      padding: 36px 32px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .login-brand-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 28px;
    }
    .login-brand-logo {
      width: 52px;
      height: 52px;
      margin-bottom: 12px;
    }
    .login-sec-note {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid var(--slate-200);
      font-size: 0.76rem;
      color: var(--slate-500);
      text-align: center;
    }
    .auth-links {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      font-size: 0.82rem;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-brand-header">
        <img src="/assets/logo.svg" alt="Richardson Oil and Gas" class="login-brand-logo" />
        <h1 style="font-size: 1.45rem; margin-bottom: 4px;">Richardson Oil &amp; Gas</h1>
        <p class="lead" style="font-size: 0.88rem; margin: 0;">Employee ID Card Management Portal</p>
      </div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Admin Email Address</label>
          <input type="email" id="email" required autocomplete="username" placeholder="name@richardsonoilandgas.com" />
        </div>
        <div class="field" id="passwordField">
          <label for="password">Password</label>
          <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••" />
        </div>
        <div class="error-text" id="err"></div>
        <button type="submit" class="btn btn-primary" id="submitBtn" style="width: 100%; padding: 12px;">
          Authenticate &amp; Sign In
        </button>

        <div class="auth-links">
          <a href="#" id="forgotPasswordLink">Forgot password?</a>
          <span style="color: var(--slate-400);">MFA / Claim Protected</span>
        </div>
      </form>

      <div class="login-sec-note">
        🔒 Authorized Richardson Oil and Gas personnel only. Access is monitored and audited.
      </div>
    </div>
  </div>

  <script type="module" src="/admin/login.js"></script>
</body>
</html>
