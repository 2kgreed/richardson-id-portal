<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Portal Sign In — Richardson Oil and Gas</title>
  <link rel="icon" type="image/png" href="/assets/richardson-logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css?v=4" />
  <style>
    body {
      background: radial-gradient(circle at 50% 20%, #0c1e4a 0%, #07132c 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-container {
      width: 100%;
      max-width: 440px;
      padding: 24px;
    }
    .login-card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.4);
      padding: 38px 34px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-top: 4px solid var(--richardson-red);
    }
    .login-brand-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 26px;
    }
    .login-brand-logo {
      height: 52px;
      width: auto;
      max-width: 220px;
      object-fit: contain;
      margin-bottom: 14px;
    }
    .login-sec-note {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid var(--slate-200);
      font-size: 0.76rem;
      color: var(--slate-500);
      text-align: center;
    }
    .auth-links {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      font-size: 0.82rem;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-brand-header">
        <img src="/assets/richardson-logo.png" alt="Richardson Oil and Gas" class="login-brand-logo" />
        <p class="lead" style="font-size: 0.88rem; margin: 0; color: var(--slate-600); font-weight: 500;">Corporate Identity &amp; Credential Portal</p>
      </div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Admin Email Address</label>
          <input type="email" id="email" required autocomplete="username" placeholder="name@richardsonoilandgas.com" />
        </div>
        <div class="field" id="passwordField">
          <label for="password">Password</label>
          <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••" />
        </div>
        <div class="error-text" id="err"></div>
        <button type="submit" class="btn btn-primary" id="submitBtn" style="width: 100%; padding: 12px;">
          Authenticate &amp; Sign In
        </button>

        <div class="auth-links">
          <a href="#" id="forgotPasswordLink">Forgot password?</a>
          <span style="color: var(--slate-400);">MFA / Claim Protected</span>
        </div>
      </form>

      <div class="login-sec-note">
        🔒 Authorized Richardson Oil and Gas personnel only. Access is monitored and audited.
      </div>
    </div>
  </div>

  <script type="module" src="/admin/login.js"></script>
</body>
</html>
